default_config:
demo:
homeassistant_alerts:
  enabled: false

# Simulated 6-speed fan + light matching the B99/EV1527 units this card was
# designed around (percentage_step = 100/6 → the card derives n = 6).
input_boolean:
  test_fan_state:
    name: Test fan state
  test_fan_light_state:
    name: Test fan light state

input_number:
  test_fan_pct:
    name: Test fan percentage
    min: 0
    max: 100
    step: 1

input_select:
  test_fan_direction:
    name: Test fan direction
    options:
      - forward
      - reverse

fan:
  - platform: template
    fans:
      test_fan:
        friendly_name: 'Test 6-Speed Fan'
        unique_id: test_fan
        speed_count: 6
        value_template: "{{ states('input_boolean.test_fan_state') }}"
        percentage_template: "{{ states('input_number.test_fan_pct') | int }}"
        direction_template: "{{ states('input_select.test_fan_direction') }}"
        turn_on:
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.test_fan_state
        turn_off:
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.test_fan_state
        set_percentage:
          - service: input_number.set_value
            target:
              entity_id: input_number.test_fan_pct
            data:
              value: '{{ percentage }}'
          - service: "input_boolean.turn_{{ 'on' if percentage | int > 0 else 'off' }}"
            target:
              entity_id: input_boolean.test_fan_state
        set_direction:
          - service: input_select.select_option
            target:
              entity_id: input_select.test_fan_direction
            data:
              option: '{{ direction }}'

light:
  - platform: template
    lights:
      test_fan_light:
        friendly_name: 'Test Fan Light'
        unique_id: test_fan_light
        value_template: "{{ states('input_boolean.test_fan_light_state') }}"
        turn_on:
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.test_fan_light_state
        turn_off:
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.test_fan_light_state
